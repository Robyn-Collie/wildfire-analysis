# Netlify configuration for the static site in site/.
# The site is generated by `python scripts/build_site.py` and committed; Netlify runs no build step.
# In the Netlify UI: link the GitHub repo, leave "Build command" empty, set "Publish directory" to site.

[build]
  publish = "site"
  command = ""

# Data and asset scripts are requested with ?v=<content hash> (scripts/build_site.py versioned()), so a new
# build changes their URLs; they can be cached for a day while the HTML always revalidates.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/figures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
