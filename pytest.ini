[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
xfail_strict = false
# MPLBACKEND=Agg is set in tests/conftest.py (pytest.ini cannot set env vars without pytest-env).
filterwarnings =
    default
    # Third-party deprecation chatter is not actionable here.
    ignore::DeprecationWarning:seaborn
    ignore::DeprecationWarning:sklearn
    ignore::DeprecationWarning:matplotlib
    ignore::PendingDeprecationWarning
